# Sender-identity fixture: a genuinely closed AgentService export.
#
# ACME hosts the service as carol. Every ACME user, including the host, is
# denied direct publish access to the fixed AgentService prompt/status
# subjects; they may only subscribe there. APP's bob reaches those subjects
# through a share:true service import, so Nats-Request-Info is a server stamp
# rather than a same-account caller-controlled header.
#
# Port-less (see nkey-noaccounts.conf). Keys: keys.json.
accounts {
  ACME {
    users: [
      {
        nkey: "UCDUW5V44EBDBIK2FL4CTNDBQFNGBEZVJHSZGQVKRHASN4AV4IWPB5NT"
        permissions: { publish: { deny: ["agents.prompt.>", "agents.status.>"] } }
      }
      {
        nkey: "UBTHWKVPPUINKFEZ6UZ6ZAWNT4RSRVVLELSMHWPMIRWRBFDCER5TSKLT"
        permissions: { publish: { deny: ["agents.prompt.>", "agents.status.>"] } }
      }
    ]
    exports: [
      { service: "agents.>", response_type: stream }
      { service: "$SRV.>",   response_type: stream }
    ]
  }
  APP {
    users: [ { nkey: "UDLPRVYPNSPIPYH4RVGKEHP2AAG4J2CN4GQ3IBTKC6ZDV6SR7ONG27D4" } ]
    imports: [
      { service: { account: ACME, subject: "agents.>" }, share: true }
      { service: { account: ACME, subject: "$SRV.>" },   share: true }
    ]
  }
}
