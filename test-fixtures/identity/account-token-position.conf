# Sender-identity fixture: a service export that inserts the caller's
# account token into the subject (`account_token_position: 2`, the
# ScratchPad shape).
#
#   ACME — alice hosts a hand-rolled service on `svc.*.prompt`.
#   APP  — bob; two import styles of the same export coexist:
#            with `to: svc.prompt`   bob publishes `svc.prompt`     → alice sees `svc.APP.prompt`
#            without `to`            bob publishes `svc.APP.prompt` → arrives as-is
#   APP2 — dave; publishes `svc.APP2.prompt` (no `share`).
#
# The import `subject` must carry the importer's OWN account name at the
# token position; another account's name there is rejected at config load.
# Port-less (see nkey-noaccounts.conf). Keys: keys.json.
accounts {
  ACME {
    users: [ { nkey: "UCDUW5V44EBDBIK2FL4CTNDBQFNGBEZVJHSZGQVKRHASN4AV4IWPB5NT" } ]
    exports: [
      { service: "svc.*.prompt", account_token_position: 2, response_type: stream }
      { service: "$SRV.>", response_type: stream }
    ]
  }
  APP {
    users: [ { nkey: "UDLPRVYPNSPIPYH4RVGKEHP2AAG4J2CN4GQ3IBTKC6ZDV6SR7ONG27D4" } ]
    imports: [
      { service: { account: ACME, subject: "svc.APP.prompt" }, to: "svc.prompt", share: true }
      { service: { account: ACME, subject: "svc.APP.prompt" }, share: true }
      { service: { account: ACME, subject: "$SRV.>" }, share: true }
    ]
  }
  APP2 {
    users: [ { nkey: "UCULTTUDI6HNG2UCJ7ORP4DMXRTLJ6HRBENRIPC6II77LO2BJMFGRU72" } ]
    imports: [ { service: { account: ACME, subject: "svc.APP2.prompt" } } ]
  }
}
