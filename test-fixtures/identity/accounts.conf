# Sender-identity fixture: four config-file accounts (T2/T3/T4 topologies).
#
#   ACME  — hosts the agent (alice, carol); exports `agents.>` and `$SRV.>`
#           with `response_type: stream` (without it a cross-account
#           requester silently loses every reply after the first).
#   APP   — bob; imports both exports with `share: true` (server-stamped
#           `Nats-Request-Info`), plus a renamed import `to: local.agents.>`.
#           That second import is deliberately NOT exercised by any test:
#           it exists to reproduce the condition below (two imports of one
#           export in one account), so that the topology stays faithful to
#           what a real deployment can look like. Rename assertions use APP3.
#   APP2  — dave; imports without `share` (header carries `acc`/`rtt` only).
#   APP3  — erin; the rename-only account for `agents.>`: it holds ONLY the
#           `to:` import of that export (plus `$SRV.>` for discovery),
#           because when one account holds both a plain and a `to:` import
#           of the same export only one of the two carries the full `share`
#           stamp. Remapped-variant assertions run from here.
#
# Port-less (see nkey-noaccounts.conf). Keys: keys.json.
accounts {
  ACME {
    users: [ { nkey: "UCDUW5V44EBDBIK2FL4CTNDBQFNGBEZVJHSZGQVKRHASN4AV4IWPB5NT" }, { nkey: "UBTHWKVPPUINKFEZ6UZ6ZAWNT4RSRVVLELSMHWPMIRWRBFDCER5TSKLT" } ]
    exports: [
      { service: "agents.>", response_type: stream }
      { service: "$SRV.>",   response_type: stream }
    ]
  }
  APP {
    users: [ { nkey: "UDLPRVYPNSPIPYH4RVGKEHP2AAG4J2CN4GQ3IBTKC6ZDV6SR7ONG27D4" } ]
    imports: [
      { service: { account: ACME, subject: "agents.>" }, share: true }
      { service: { account: ACME, subject: "agents.>" }, to: "local.agents.>", share: true }
      { service: { account: ACME, subject: "$SRV.>" },   share: true }
    ]
  }
  APP2 {
    users: [ { nkey: "UCULTTUDI6HNG2UCJ7ORP4DMXRTLJ6HRBENRIPC6II77LO2BJMFGRU72" } ]
    imports: [
      { service: { account: ACME, subject: "agents.>" } }
      { service: { account: ACME, subject: "$SRV.>" } }
    ]
  }
  APP3 {
    users: [ { nkey: "UAWSCQE7QNCWGK7CN7G5TS34T425NML5HETNUHYEAMGFVWBWGJI3K2WW" } ]
    imports: [
      { service: { account: ACME, subject: "agents.>" }, to: "local.agents.>", share: true }
      { service: { account: ACME, subject: "$SRV.>" }, share: true }
    ]
  }
}
