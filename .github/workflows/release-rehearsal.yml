name: CI — release rehearsal

on:
  push:
    branches: [sdk-release-rollout]
    paths:
      - "client-sdk/**"
      - "agent-sdk/**"
      - "agents/**"
      - "examples/**"
      - "devtools/release/**"
      - ".github/workflows/release-*.yml"
      - "LICENSE"
  pull_request:
    branches: [sdk-release-rollout]
    paths:
      - "client-sdk/**"
      - "agent-sdk/**"
      - "agents/**"
      - "examples/**"
      - "devtools/release/**"
      - ".github/workflows/release-*.yml"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-release-rehearsal-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.26"

jobs:
  validate:
    name: Validate graph and freeze
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "client-sdk/python/uv.lock"

      - name: Validate release inventory
        run: python3 devtools/release/release.py validate-source

      - name: Run release-tool tests
        run: python3 -m unittest discover -s devtools/release/tests -v

      - name: Lint release tool
        run: |
          uv run --project client-sdk/python --locked ruff check \
            devtools/release/release.py devtools/release/tests/test_release.py
          uv run --project client-sdk/python --locked ruff format --check \
            devtools/release/release.py devtools/release/tests/test_release.py

      - name: Verify frozen dependency inputs
        run: python3 devtools/release/release.py freeze check

  npm-artifacts:
    name: Build and test npm artifacts
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Stage tracked release source
        run: |
          python3 devtools/release/release.py stage \
            --source "$GITHUB_SHA" \
            --versions devtools/release/versions.rehearsal.json \
            --output "$RUNNER_TEMP/release-stage"

      - name: Build once and test exact tarballs
        run: |
          python3 devtools/release/release.py build-npm \
            --stage "$RUNNER_TEMP/release-stage" \
            --output "$RUNNER_TEMP/npm-artifacts"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/npm-artifacts/
          if-no-files-found: error
          retention-days: 7

  python-artifacts:
    name: Build and test Python artifacts
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true

      - name: Stage tracked release source
        run: |
          python3 devtools/release/release.py stage \
            --source "$GITHUB_SHA" \
            --versions devtools/release/versions.rehearsal.json \
            --output "$RUNNER_TEMP/release-stage"

      - name: Build once and test exact distributions
        run: |
          python3 devtools/release/release.py build-python \
            --stage "$RUNNER_TEMP/release-stage" \
            --output "$RUNNER_TEMP/python-artifacts"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-release-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/python-artifacts/
          if-no-files-found: error
          retention-days: 7
