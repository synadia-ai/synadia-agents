name: CI — agents (TypeScript)

# Runs the test suites for the TypeScript agent harnesses. Packages that
# consume the published TS SDKs use semver ranges; older packages may still
# use local file links, so SDK changes trigger this workflow too.
# SDK tarballs here are branch-local overlays and may contain runner-local
# dependency paths. These checks prove coordinated branch compatibility, not
# the clean staged manifests/locks or immutable bytes required for release.
on:
  push:
    branches: [main, sdk-release-rollout, rollout-agent-integrations]
    paths:
      - "agents/pi/**"
      - "agents/openclaw/**"
      - "agents/opencode/**"
      - "agents/codex/**"
      - "agents/acp/**"
      - "agents/grok/**"
      - "agents/eve/**"
      - "agents/flue/**"
      - "agents/claude-code/**"
      - "agents/open-agent/**"
      - ".claude-plugin/**"
      - "client-sdk/typescript/**"
      - "agent-sdk/typescript/**"
      - ".github/workflows/agents-typescript.yml"
  pull_request:
    paths:
      - "agents/pi/**"
      - "agents/openclaw/**"
      - "agents/opencode/**"
      - "agents/codex/**"
      - "agents/acp/**"
      - "agents/grok/**"
      - "agents/eve/**"
      - "agents/flue/**"
      - "agents/claude-code/**"
      - "agents/open-agent/**"
      - ".claude-plugin/**"
      - "client-sdk/typescript/**"
      - "agent-sdk/typescript/**"
      - ".github/workflows/agents-typescript.yml"

concurrency:
  group: ci-agents-ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi:
    name: agents/pi (unit + spec smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install nats-server
        run: |
          curl -L -o nats-server.tar.gz https://github.com/nats-io/nats-server/releases/download/v2.12.3/nats-server-v2.12.3-linux-amd64.tar.gz
          tar -xzf nats-server.tar.gz --strip-components=1
          sudo mv nats-server /usr/local/bin/
          nats-server --version
      # Build the branch SDKs, then install the exact packed artifacts into
      # pi. This exercises what a registry consumer receives and avoids Bun's
      # cyclic local-file resolver.
      - name: Build current client-sdk artifact
        working-directory: client-sdk/typescript
        run: |
          npm install
          bun run build
          tgz="$(npm pack --json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => console.log(JSON.parse(s)[0].filename))")"
          echo "CLIENT_SDK_TGZ=$PWD/$tgz" >> "$GITHUB_ENV"
      - name: Build current agent-sdk artifact
        working-directory: agent-sdk/typescript
        run: |
          npm pkg set "dependencies.@synadia-ai/agents=file:$CLIENT_SDK_TGZ"
          npm install
          bun run build
          tgz="$(npm pack --json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => console.log(JSON.parse(s)[0].filename))")"
          echo "AGENT_SDK_TGZ=$PWD/$tgz" >> "$GITHUB_ENV"
      - name: Install pi from packed SDKs
        working-directory: agents/pi
        run: |
          npm pkg set "dependencies.@synadia-ai/agents=file:$CLIENT_SDK_TGZ"
          npm pkg set "dependencies.@synadia-ai/agent-service=file:$AGENT_SDK_TGZ"
          npm install --no-package-lock --no-audit --no-fund
      - name: Unit tests
        working-directory: agents/pi
        run: bun test test/owner.test.ts test/context.test.ts test/prompt-queue.test.ts
      - name: Identity-mode smoke (spawns its own nats-server)
        working-directory: agents/pi
        run: bun run test:smoke
      - name: Package contents
        working-directory: agents/pi
        run: npm pack --dry-run --json

  openclaw:
    name: agents/openclaw ${{ matrix.openclaw-version }} (build + test)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release plus a newer validated release. The peer
        # range remains bounded; testing arbitrary latest could move outside it.
        openclaw-version: ["2026.5.4", "2026.8.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build current client-sdk artifact
        working-directory: client-sdk/typescript
        run: |
          npm install
          npm run build
          tgz="$(npm pack --json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => console.log(JSON.parse(s)[0].filename))")"
          echo "CLIENT_SDK_TGZ=$PWD/$tgz" >> "$GITHUB_ENV"
      - name: Build current agent-sdk artifact
        working-directory: agent-sdk/typescript
        run: |
          npm pkg set "dependencies.@synadia-ai/agents=file:$CLIENT_SDK_TGZ"
          npm install
          npm run build
          tgz="$(npm pack --json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => console.log(JSON.parse(s)[0].filename))")"
          echo "AGENT_SDK_TGZ=$PWD/$tgz" >> "$GITHUB_ENV"
      # The peer is optional, so install each matrix endpoint explicitly and
      # assert the subpath used by the plugin resolves before tests begin.
      - name: Install openclaw deps + peer
        working-directory: agents/openclaw
        run: |
          npm pkg set "dependencies.@synadia-ai/agents=file:$CLIENT_SDK_TGZ"
          npm pkg set "dependencies.@synadia-ai/agent-service=file:$AGENT_SDK_TGZ"
          npm pkg set "dependencies.openclaw=${{ matrix.openclaw-version }}"
          npm install
          node -e "require.resolve('openclaw/plugin-sdk/core')"
      - name: Build
        working-directory: agents/openclaw
        run: npm run build
      - name: Tests (configuration + connection bundle + protocol)
        working-directory: agents/openclaw
        run: npm test
      - name: Package contents
        working-directory: agents/openclaw
        run: npm pack --dry-run --json

  opencode:
    name: agents/opencode (typecheck + package-safe smokes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install nats-server
        run: |
          curl -L -o nats-server.tar.gz https://github.com/nats-io/nats-server/releases/download/v2.12.3/nats-server-v2.12.3-linux-amd64.tar.gz
          tar -xzf nats-server.tar.gz --strip-components=1
          sudo mv nats-server /usr/local/bin/
          nats-server --version
      - name: Build current client-sdk
        working-directory: client-sdk/typescript
        run: |
          npm install
          bun run build
          tgz="$(npm pack --json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => console.log(JSON.parse(s)[0].filename))")"
          echo "CLIENT_SDK_TGZ=$PWD/$tgz" >> "$GITHUB_ENV"
      - name: Build current agent-sdk
        working-directory: agent-sdk/typescript
        run: |
          # CI-only: replace the relative file: link with an absolute tgz so the packed agent-service artifact resolves after install.
          npm pkg set "dependencies.@synadia-ai/agents=file:$CLIENT_SDK_TGZ"
          npm install
          bun run build
          tgz="$(npm pack --json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => console.log(JSON.parse(s)[0].filename))")"
          echo "AGENT_SDK_TGZ=$PWD/$tgz" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: agents/opencode
        run: |
          bun install
          npm install --no-save "$CLIENT_SDK_TGZ" "$AGENT_SDK_TGZ"
      - name: Typecheck
        working-directory: agents/opencode
        run: bun run typecheck
      - name: Unit tests
        working-directory: agents/opencode
        run: bun test
      - name: Protocol smoke
        working-directory: agents/opencode
        run: bun run smoke:protocol
      # `smoke:opencode-lifecycle` starts the real opencode binary; GitHub
      # runners do not install OpenCode. Keep it as a local/manual gate.
      - name: Plugin lifecycle smoke
        working-directory: agents/opencode
        run: bun run smoke:opencode-plugin-lifecycle
      - name: Plugin permission smoke
        working-directory: agents/opencode
        run: bun run smoke:opencode-plugin-permission
      - name: Package contents
        working-directory: agents/opencode
        run: npm pack --dry-run --json

  codex:
    name: agents/codex (typecheck + package-safe smokes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install nats-server
        run: |
          curl -L -o nats-server.tar.gz https://github.com/nats-io/nats-server/releases/download/v2.12.3/nats-server-v2.12.3-linux-amd64.tar.gz
          tar -xzf nats-server.tar.gz --strip-components=1
          sudo mv nats-server /usr/local/bin/
          nats-server --version
      - name: Build current client-sdk
        working-directory: client-sdk/typescript
        run: |
          npm install
          bun run build
          tgz="$(npm pack --json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => console.log(JSON.parse(s)[0].filename))")"
          echo "CLIENT_SDK_TGZ=$PWD/$tgz" >> "$GITHUB_ENV"
      - name: Build current agent-sdk
        working-directory: agent-sdk/typescript
        run: |
          # CI-only: replace the relative file: link with an absolute tgz so the packed agent-service artifact resolves after install.
          npm pkg set "dependencies.@synadia-ai/agents=file:$CLIENT_SDK_TGZ"
          npm install
          bun run build
          tgz="$(npm pack --json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => console.log(JSON.parse(s)[0].filename))")"
          echo "AGENT_SDK_TGZ=$PWD/$tgz" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: agents/codex
        run: |
          bun install
          npm install --no-save "$CLIENT_SDK_TGZ" "$AGENT_SDK_TGZ"
      - name: Typecheck
        working-directory: agents/codex
        run: bun run typecheck
      - name: Unit tests
        working-directory: agents/codex
        run: bun test
      - name: Protocol smoke
        working-directory: agents/codex
        run: bun run smoke:protocol
      # `smoke:codex-runtime` includes `codex app-server`; CI does not install
      # Codex. Run the deterministic fake-runtime and manager smokes here, and
      # keep the real app-server lifecycle as a local/manual validation gate.
      - name: Fake runtime smoke
        working-directory: agents/codex
        run: bun run smoke:codex-fake-runtime
      - name: Session manager smoke
        working-directory: agents/codex
        run: bun run smoke:codex-session-manager
      - name: Future watch smoke
        working-directory: agents/codex
        run: bun run smoke:codex-future-watch
      - name: Permission smoke
        working-directory: agents/codex
        run: bun run smoke:codex-permission
      - name: Package contents
        working-directory: agents/codex
        run: npm pack --dry-run --json

  eve:
    name: agents/eve (typecheck + package-safe smokes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install nats-server
        run: |
          curl -L -o nats-server.tar.gz https://github.com/nats-io/nats-server/releases/download/v2.12.3/nats-server-v2.12.3-linux-amd64.tar.gz
          tar -xzf nats-server.tar.gz --strip-components=1
          sudo mv nats-server /usr/local/bin/
          nats-server --version
      - name: Build current client-sdk
        working-directory: client-sdk/typescript
        run: |
          npm install --no-package-lock --no-audit --no-fund
          bun run build
          tgz="$(npm pack --json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => console.log(JSON.parse(s)[0].filename))")"
          echo "CLIENT_SDK_TGZ=$PWD/$tgz" >> "$GITHUB_ENV"
      - name: Build current agent-sdk
        working-directory: agent-sdk/typescript
        run: |
          # CI-only: replace the relative file: link with an absolute tgz so the packed agent-service artifact resolves after install.
          npm pkg set "dependencies.@synadia-ai/agents=file:$CLIENT_SDK_TGZ"
          npm install --no-package-lock --no-audit --no-fund
          bun run build
          tgz="$(npm pack --json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => console.log(JSON.parse(s)[0].filename))")"
          echo "AGENT_SDK_TGZ=$PWD/$tgz" >> "$GITHUB_ENV"
      # `bun install` (1.3.14) deterministically segfaults on Linux x64
      # while resolving eve's dependency tree (nitro + platform-optional
      # deps): ~5 min of resolver CPU, then a crash — reproduced across
      # reruns, while the same install takes seconds on macOS. Install
      # with npm instead; Bun remains the runtime for typecheck, tests,
      # and smokes. Revisit when a newer Bun resolves this tree.
      - name: Install dependencies
        working-directory: agents/eve
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save "$CLIENT_SDK_TGZ" "$AGENT_SDK_TGZ"
      - name: Typecheck
        working-directory: agents/eve
        run: bun run typecheck
      - name: Unit tests
        working-directory: agents/eve
        run: bun test
      - name: Protocol smoke (spawns a disposable nats-server)
        working-directory: agents/eve
        run: bun run smoke:protocol
      # `smoke:real-eve` spawns `npx eve dev --no-ui` on the mockModel
      # fixture — no provider key needed, but it wants a Node >= 24
      # toolchain next to Bun. Kept as a local/manual gate for now;
      # candidate for a follow-up CI job with actions/setup-node@24.
      - name: Package contents
        working-directory: agents/eve
        run: npm pack --dry-run --json

  acp:
    name: agents/acp + agents/grok (typecheck + package-safe smokes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install nats-server
        run: |
          curl -L -o nats-server.tar.gz https://github.com/nats-io/nats-server/releases/download/v2.12.3/nats-server-v2.12.3-linux-amd64.tar.gz
          tar -xzf nats-server.tar.gz --strip-components=1
          sudo mv nats-server /usr/local/bin/
          nats-server --version
      - name: Build current client-sdk
        working-directory: client-sdk/typescript
        run: |
          npm install --no-package-lock --no-audit --no-fund
          bun run build
          tgz="$(npm pack --json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => console.log(JSON.parse(s)[0].filename))")"
          echo "CLIENT_SDK_TGZ=$PWD/$tgz" >> "$GITHUB_ENV"
      - name: Build current agent-sdk
        working-directory: agent-sdk/typescript
        run: |
          # CI-only: replace the relative file: link with an absolute tgz so the packed agent-service artifact resolves after install.
          npm pkg set "dependencies.@synadia-ai/agents=file:$CLIENT_SDK_TGZ"
          npm install --no-package-lock --no-audit --no-fund
          bun run build
          tgz="$(npm pack --json | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => console.log(JSON.parse(s)[0].filename))")"
          echo "AGENT_SDK_TGZ=$PWD/$tgz" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: agents/acp
        run: |
          bun install
          npm install --no-save "$CLIENT_SDK_TGZ" "$AGENT_SDK_TGZ"
      - name: Typecheck
        working-directory: agents/acp
        run: bun run typecheck
      - name: Unit tests
        working-directory: agents/acp
        run: bun test
      - name: Protocol smoke
        working-directory: agents/acp
        run: bun run smoke:protocol
      # The managed-runtime smoke drives a fake ACP agent subprocess over the
      # real NDJSON wire; no grok/gemini binary is required. Real-agent runs
      # stay a local/manual validation gate.
      - name: Fake runtime smoke
        working-directory: agents/acp
        run: bun run smoke:acp-fake-runtime
      - name: Package contents
        working-directory: agents/acp
        run: npm pack --dry-run --json
      # The grok wrapper is a thin pin over agents/acp (file:../acp link
      # pre-publish), so it rides in the same job: pure-argv unit tests, no
      # NATS or grok binary required.
      - name: Install grok wrapper deps
        working-directory: agents/grok
        run: bun install
      - name: Typecheck grok wrapper
        working-directory: agents/grok
        run: bun run typecheck
      - name: Grok wrapper unit tests
        working-directory: agents/grok
        run: bun test

  flue:
    name: agents/flue (typecheck + tests + protocol smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install nats-server
        run: |
          curl -L -o nats-server.tar.gz https://github.com/nats-io/nats-server/releases/download/v2.12.3/nats-server-v2.12.3-linux-amd64.tar.gz
          tar -xzf nats-server.tar.gz --strip-components=1
          sudo mv nats-server /usr/local/bin/
