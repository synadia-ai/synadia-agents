name: CI — agent-sdk/typescript

on:
  push:
    branches: [main, sdk-release-rollout, rollout-agent-integrations]
    paths:
      - "agent-sdk/typescript/**"
      - "client-sdk/typescript/**"
      - "test-fixtures/**"
      - ".github/workflows/agent-sdk-typescript.yml"
  pull_request:
    paths:
      - "agent-sdk/typescript/**"
      - "client-sdk/typescript/**"
      - "test-fixtures/**"
      - ".github/workflows/agent-sdk-typescript.yml"

concurrency:
  group: ci-ts-host-${{ github.ref }}
  cancel-in-progress: true

env:
  # One pin for every job that installs nats-server; the tarball name below
  # derives from it for Linux and macOS alike.
  NATS_SERVER_VERSION: "2.12.7"

defaults:
  run:
    working-directory: agent-sdk/typescript

jobs:
  lint-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The host's typecheck path-aliases `@synadia-ai/agents` to caller
      # source, while its declaration build deliberately resolves the caller's
      # built declarations. Install and build the caller before the host.
      - name: Install and build caller package
        working-directory: client-sdk/typescript
        run: |
          npm install
          npm run build
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Example connection-bundle tests
        run: npx vitest run --config examples/_vitest.config.ts

  test-node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        node: [20, 22, 24]
        include:
          - os: macos-14
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install nats-server
        # Extract in the runner's temp dir so the unpacked tarball never lands
        # inside the package directory. One tarball per platform — there is no
        # versioned brew formula, so macOS uses the darwin-arm64 build too.
        working-directory: ${{ runner.temp }}
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   platform=linux-amd64 ;;
            macOS-ARM64) platform=darwin-arm64 ;;
            *) echo "no nats-server download mapping for ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/nats-server-v${NATS_SERVER_VERSION}-${platform}.tar.gz" | tar xz
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "nats-server-v${NATS_SERVER_VERSION}-${platform}/nats-server" /usr/local/bin/nats-server
          nats-server --version
      - name: Lint identity fixtures (nats-server -t)
        working-directory: ${{ github.workspace }}
        run: |
          shopt -s nullglob
          confs=(test-fixtures/identity/*.conf test-fixtures/identity/operator/*.conf)
          if [ "${#confs[@]}" -eq 0 ]; then
            echo "no fixture configs found under test-fixtures/identity/" >&2
            exit 1
          fi
          for f in "${confs[@]}"; do
            nats-server -t -c "$f"
          done
      - name: Install caller deps
        working-directory: client-sdk/typescript
        run: npm install
      - run: npm install
      - run: npm run test:unit
      - run: npm run test:integration

  test-bun:
    name: Bun ${{ matrix.bun }}
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.2", "latest"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install nats-server
        # Extract in the runner's temp dir so the unpacked tarball never lands
        # inside the package directory. One tarball per platform — there is no
        # versioned brew formula, so macOS uses the darwin-arm64 build too.
        working-directory: ${{ runner.temp }}
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   platform=linux-amd64 ;;
            macOS-ARM64) platform=darwin-arm64 ;;
            *) echo "no nats-server download mapping for ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/nats-server-v${NATS_SERVER_VERSION}-${platform}.tar.gz" | tar xz
          sudo mkdir -p /usr/local/bin
          sudo install -m 0755 "nats-server-v${NATS_SERVER_VERSION}-${platform}/nats-server" /usr/local/bin/nats-server
          nats-server --version
      - name: Lint identity fixtures (nats-server -t)
        working-directory: ${{ github.workspace }}
        run: |
          shopt -s nullglob
          confs=(test-fixtures/identity/*.conf test-fixtures/identity/operator/*.conf)
          if [ "${#confs[@]}" -eq 0 ]; then
            echo "no fixture configs found under test-fixtures/identity/" >&2
            exit 1
          fi
          for f in "${confs[@]}"; do
            nats-server -t -c "$f"
          done
      - name: Install caller deps
        working-directory: client-sdk/typescript
        run: bun install
      - run: bun install
      - run: bun x vitest run test/unit
      - run: bun x vitest run test/integration
