name: CI — client-sdk/python

on:
  push:
    branches: [main, sdk-release-rollout]
    paths:
      - "client-sdk/python/**"
      # The identity fixtures and the TS SDK (reference agent / client probe)
      # are exercised by this suite's cross-SDK tests — a TS-only change must
      # trigger it too.
      - "test-fixtures/**"
      - "client-sdk/typescript/**"
      - "agent-sdk/typescript/**"
      - ".github/workflows/client-sdk-python.yml"
  pull_request:
    branches: [main, sdk-release-rollout]
    paths:
      - "client-sdk/python/**"
      # The identity fixtures and the TS SDK (reference agent / client probe)
      # are exercised by this suite's cross-SDK tests — a TS-only change must
      # trigger it too.
      - "test-fixtures/**"
      - "client-sdk/typescript/**"
      - "agent-sdk/typescript/**"
      - ".github/workflows/client-sdk-python.yml"

concurrency:
  group: ci-py-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client-sdk/python

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      NATS_SERVER_VERSION: "2.12.7"
    steps:
      - uses: actions/checkout@v4

      - name: Install nats-server
        # Override the default working-directory so the tarball extracts into
        # the runner's auto-cleaned temp area instead of leaving the unpacked
        # `nats-server-v*-linux-amd64/` parent directory in `client-sdk/python/`
        # after the binary is `mv`'d out. (The default at job level is
        # `client-sdk/python`; without this override, every CI run dropped a
        # stray dir there.)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/nats-server-v${NATS_SERVER_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo mv "nats-server-v${NATS_SERVER_VERSION}-linux-amd64/nats-server" /usr/local/bin/
          nats-server --version

      - name: Lint identity fixtures (nats-server -t)
        working-directory: ${{ github.workspace }}
        run: |
          shopt -s nullglob
          confs=(test-fixtures/identity/*.conf test-fixtures/identity/operator/*.conf)
          if [ "${#confs[@]}" -eq 0 ]; then
            echo "no fixture configs found under test-fixtures/identity/" >&2
            exit 1
          fi
          for f in "${confs[@]}"; do
            nats-server -t -c "$f"
          done

      # The cross-SDK interop tests spawn the TS SDK under `bun` (the TS
      # reference agent here, the TS client probe in the agent-sdk workflow);
      # without `node_modules/` in client-sdk/typescript they skip silently.
      # Bun is pinned: 1.4.0 broke nested `file:` installs (#175).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install TS SDK deps (cross-SDK interop)
        working-directory: client-sdk/typescript
        run: bun install --frozen-lockfile

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "client-sdk/python/uv.lock"
          python-version: ${{ matrix.python-version }}

      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests examples
      - run: uv run pytest -v

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-py${{ matrix.python-version }}
          path: client-sdk/python/tests/_evidence/
          retention-days: 7
