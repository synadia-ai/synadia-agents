name: CI — examples (TypeScript)

# Branch-development checks for the runnable examples. They all `file:`-link the
# local SDKs, so an SDK surface change that breaks an example shows up
# here instead of after a release. Focused deterministic tests and builds run
# where packages expose them; LLM-backed behavior remains a manual gate.
#
# Installs use npm, not bun: bun 1.3.14's resolver is nondeterministic
# on the client-sdk ⇄ agent-sdk `file:` cycle — it can hang forever or
# die with SIGILL ("Illegal instruction") after ~7 minutes, on macOS
# and Linux alike. npm symlinks `file:` deps and is unaffected. Revisit
# once a bun release fixes cyclic file: resolution.

on:
  push:
    branches: [main, sdk-release-rollout, rollout-agent-integrations]
    paths:
      - "examples/**"
      - "client-sdk/typescript/**"
      - "agent-sdk/typescript/**"
      - ".github/workflows/examples-typescript.yml"
  pull_request:
    paths:
      - "examples/**"
      - "client-sdk/typescript/**"
      - "agent-sdk/typescript/**"
      - ".github/workflows/examples-typescript.yml"

concurrency:
  group: ci-examples-ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: examples/${{ matrix.example }} (typecheck)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example:
          - agent-web-ui
          - claude-code-headless
          - dspy
          - dspy-research-agent
          - durable-agents
          - open-agent-vercel
          - pi-headless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # The examples import the SDKs via `file:` links, which resolve to
      # each package's built `dist/` — build both before installing.
      - name: Build client-sdk
        working-directory: client-sdk/typescript
        run: npm install --no-audit --no-fund && npm run build
      - name: Build agent-sdk
        working-directory: agent-sdk/typescript
        run: npm install --no-audit --no-fund && npm run build
      # open-agent-vercel file:-links agents/open-agent and path-aliases
      # into its vendored sources, whose `ai`/`zod` imports resolve from
      # that agent's own node_modules — install it first.
      - name: Install agents/open-agent deps
        if: matrix.example == 'open-agent-vercel'
        working-directory: agents/open-agent
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: examples/${{ matrix.example }}
        run: npm install --no-audit --no-fund && npm run typecheck
      - name: Install nats-server for identity smokes
        if: matrix.example == 'claude-code-headless' || matrix.example == 'pi-headless'
        working-directory: ${{ runner.temp }}
        run: |
          version=2.12.7
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${version}/nats-server-v${version}-linux-amd64.tar.gz" | tar xz
          sudo install -m 0755 "nats-server-v${version}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server --version
      - name: Focused tests
        if: matrix.example == 'claude-code-headless' || matrix.example == 'open-agent-vercel' || matrix.example == 'pi-headless'
        working-directory: examples/${{ matrix.example }}
        run: npm test
      - name: PI identity-mode smoke
        if: matrix.example == 'pi-headless'
        working-directory: examples/pi-headless
        run: npm run test:smoke
      - name: Build when available
        working-directory: examples/${{ matrix.example }}
        run: npm run build --if-present
      - name: Inspect publishable headless package
        if: matrix.example == 'claude-code-headless' || matrix.example == 'pi-headless'
        working-directory: examples/${{ matrix.example }}
        run: npm pack --dry-run --json
