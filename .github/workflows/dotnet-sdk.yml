name: CI — .NET SDK

on:
  push:
    branches: [main, sdk-release-rollout, rollout-agent-integrations]
    paths:
      - "client-sdk/dotnet/**"
      - "agent-sdk/dotnet/**"
      - "client-sdk/typescript/**"
      - "agent-sdk/typescript/**"
      - "test-fixtures/**"
      - ".github/workflows/dotnet-sdk.yml"
  pull_request:
    paths:
      - "client-sdk/dotnet/**"
      - "agent-sdk/dotnet/**"
      - "client-sdk/typescript/**"
      - "agent-sdk/typescript/**"
      - "test-fixtures/**"
      - ".github/workflows/dotnet-sdk.yml"

concurrency:
  group: ci-dotnet-${{ github.ref }}
  cancel-in-progress: true

env:
  NATS_SERVER_VERSION: "2.12.7"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: .NET (net8.0 + net10.0) on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: oven-sh/setup-bun@v2
      - name: Install nats-server
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/nats-server-v${NATS_SERVER_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo install -m 0755 "nats-server-v${NATS_SERVER_VERSION}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server --version
      # The interop tests drive the TS reference agent / caller probe with bun; they skip (with a note) when the TS
      # SDKs are not built, so this step only widens coverage.
      - name: Build TS SDKs for interop
        run: |
          (cd client-sdk/typescript && bun install && bun run build)
          (cd agent-sdk/typescript && bun install && bun run build)
          # bun copies file: deps, so re-install the caller to pick up the freshly built host package.
          (cd client-sdk/typescript && bun install --force)
      - name: Caller SDK — build + test
        working-directory: client-sdk/dotnet
        run: dotnet test -c Release
      - name: Host SDK — build + test (incl. e2e and interop)
        working-directory: agent-sdk/dotnet
        run: dotnet test -c Release
      - name: Build examples (file-based apps)
        run: |
          for f in client-sdk/dotnet/examples/*.cs agent-sdk/dotnet/examples/*.cs; do
            echo "::group::$f"
            dotnet build "$f"
            echo "::endgroup::"
          done
